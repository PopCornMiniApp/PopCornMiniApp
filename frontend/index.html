<!DOCTYPE html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#0d0d0d" />
    <title>🍿 PopCorn</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
      :root { --tg-safe-top: env(safe-area-inset-top, 0px); }
      * { box-sizing: border-box; margin: 0; padding: 0; }
      html, body { height: 100%; overscroll-behavior: none; }
      body { background: #0d0d0d; color: #fff; font-family: 'Segoe UI', system-ui, sans-serif; overflow-x: hidden; }
      #root { min-height: 100%; }
      ::-webkit-scrollbar { width: 4px; height: 4px; }
      ::-webkit-scrollbar-track { background: #1a1a1a; }
      ::-webkit-scrollbar-thumb { background: #f59e0b; border-radius: 2px; }
    </style>
    <script>
      (function () {
        try {
          var tg = window.Telegram && window.Telegram.WebApp;
          if (tg) {
            /* Use ONLY safeAreaInset — the phone notch/status-bar.
               contentSafeAreaInset includes Telegram's header which is
               already OUTSIDE the WebApp viewport — never add it. */
            var top = (tg.safeAreaInset && tg.safeAreaInset.top) || 0;
            if (top > 0)
              document.documentElement.style.setProperty('--tg-safe-top', top + 'px');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
